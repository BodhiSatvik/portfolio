name: Deploy portfolio to GitHub Pages

on:
  # Rebuild the site on every push to main
  push:
    branches: [main]
  # Adds a manual "Run workflow" button in the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If a deploy is already running, the newest push wins instead of queueing behind it
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site as an artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Static site: the whole repo root is the site
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
